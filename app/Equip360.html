<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equip360 — Asset Tracking &amp; History System</title>
<style>
:root{
  --canvas:#eceff3; --panel:#ffffff; --rail:#171c22; --rail2:#20272f;
  --ink:#12171c; --ink2:#4d5a67; --ink3:#7d8b99; --line:#d6dce3; --line2:#e8ecf1;
  --steel:#1d4e6b; --steel2:#2a6c93; --steelsoft:#e5eef4;
  --ok:#1c7a46; --oksoft:#e2f2e9; --warn:#a3620a; --warnsoft:#fbeedb;
  --bad:#a92b21; --badsoft:#fae6e4; --hole:#25557d; --holesoft:#e3ecf5;
  --mute:#6d7a87; --mutesoft:#eceff2;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --ui:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:6px; --sh:0 1px 2px rgba(18,23,28,.08),0 4px 14px rgba(18,23,28,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.55;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em;direction:ltr;unicode-bidi:embed;display:inline-block}
a{color:var(--steel2)}

/* ---------- shell ---------- */
#shell{display:flex;height:100%}
#rail{width:210px;flex:0 0 210px;background:var(--rail);color:#c8d2dc;display:flex;flex-direction:column;overflow:hidden}
#brand{padding:11px 12px;border-bottom:1px solid #2b333c;display:flex;gap:10px;align-items:center}
#brandLogo{width:28px;height:28px;border-radius:5px;background:var(--steel2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;flex:0 0 28px}
#brandLogo img{width:100%;height:100%;object-fit:contain;background:#fff}
#brandText b{display:block;color:#fff;font-size:13.5px;line-height:1.25}
#brandText span{font-size:10px;color:#8794a1;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
nav{padding:6px;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#3a444f #171c22}
nav button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;color:#b6c2cf;padding:6px 10px;border-radius:var(--r);cursor:pointer;text-align:left;margin-bottom:1px;font-size:13px;line-height:1.35}
nav button:hover{background:var(--rail2);color:#fff}
nav button.on{background:var(--steel);color:#fff;font-weight:600}
nav button .ic{width:18px;text-align:center;opacity:.9}
nav .cnt{margin-inline-start:auto;font-family:var(--mono);font-size:10px;background:#2c343d;padding:0 5px;border-radius:9px;color:#9fb0c0}
nav button.on .cnt{background:rgba(255,255,255,.18);color:#fff}
#railFoot{padding:7px;border-top:1px solid #2b333c;font-size:10px;color:#7b8794;flex:0 0 auto}
#railFoot .fb{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px}
#railFoot button{width:100%;background:var(--rail2);border:1px solid #333c46;color:#c8d2dc;padding:5px 4px;border-radius:var(--r);cursor:pointer;font-size:11px;white-space:nowrap;overflow:hidden}
#railFoot button:hover{background:#2b333c;color:#fff}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#top h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px}
#top .sub{color:var(--ink3);font-size:12px}
#top .grow{flex:1}
#view{flex:1;overflow:auto;padding:18px 20px 60px}

/* ---------- atoms ---------- */
.btn{background:var(--steel);color:#fff;border:0;padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:600}
.btn:hover{background:var(--steel2)}
.btn.g{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.g:hover{background:var(--mutesoft)}
.btn.sm{padding:5px 10px;font-size:12.5px;font-weight:500}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
.card h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3)}
.small{font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steelsoft);border-color:var(--steel2)}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.chip.hole{background:var(--holesoft);color:var(--hole)}
.chip.warn{background:var(--warnsoft);color:var(--warn)}
.chip.bad{background:var(--badsoft);color:var(--bad)}
.chip.mute{background:var(--mutesoft);color:var(--mute)}
.chip.steel{background:var(--steelsoft);color:var(--steel)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;color:var(--ink2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:#f7f9fb;position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:#f6f9fc}
tbody tr.clickable{cursor:pointer}
.tw{overflow:auto;max-height:calc(100vh - 260px)}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:5px}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:13px 15px;cursor:pointer;box-shadow:var(--sh);border-top:3px solid var(--mute)}
.tile:hover{border-color:var(--steel2)}
.tile .n{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.1}
.tile .l{font-size:12px;color:var(--ink2);margin-top:2px}
.tile.ok{border-top-color:var(--ok)} .tile.hole{border-top-color:var(--hole)}
.tile.warn{border-top-color:var(--warn)} .tile.bad{border-top-color:var(--bad)}
.tile.steel{border-top-color:var(--steel)}
.attn{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2);align-items:center;cursor:pointer}
.attn:hover{background:#f6f9fc}
.attn .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--steel2)}

/* ---------- asset detail ---------- */
#sheet{position:fixed;inset:0;background:rgba(14,19,24,.45);display:none;z-index:40}
#sheet.on{display:block}
#sheetBox{position:absolute;inset-inline-start:0;top:0;bottom:0;width:min(1180px,100%);background:var(--canvas);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.3)}
#sheetHead{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px}
#sheetBody{flex:1;overflow:auto;padding:16px 18px 50px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:10px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;cursor:pointer;color:var(--ink2);font-weight:500}
.tabs button.on{border-bottom-color:var(--steel);color:var(--ink);font-weight:650}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 16px}
.kv div{padding:7px 0;border-bottom:1px dashed var(--line2);display:flex;gap:8px;font-size:13px}
.kv div b{color:var(--ink2);font-weight:500;min-width:96px}
.tree{list-style:none;margin:0;padding:0}
.tree li{border-bottom:1px solid var(--line2)}
.tree .slot{display:flex;align-items:center;gap:10px;padding:9px 14px}
.tree .slot .nm{font-weight:600;min-width:130px}
.tree .slot .grow{flex:1}
.tl{position:relative;padding-inline-start:20px}
.tl::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:9px 0 9px 4px;border-bottom:1px dashed var(--line2)}
.tl .ev::before{content:"";position:absolute;inset-inline-start:-19px;top:15px;width:9px;height:9px;border-radius:50%;background:var(--steel2);border:2px solid var(--panel)}
.tl .ev.m::before{background:var(--warn)} .tl .ev.i::before{background:var(--ok)}
.tl .ev.v::before{background:var(--mute)} .tl .ev.f::before{background:var(--bad)}
.tl .ev .h{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.tl .ev .h b{font-size:13px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(14,19,24,.5);display:none;z-index:60;padding:24px;overflow:auto}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
#modalBox{background:var(--panel);border-radius:10px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}
#modalHead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#modalHead b{font-size:15px}
#modalBody{padding:18px;max-height:calc(100vh - 210px);overflow:auto}
#modalFoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-start;background:#fafbfc;border-radius:0 0 10px 10px}
.x{margin-inline-start:auto;background:none;border:0;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}
.x:hover{color:var(--ink)}

/* ---------- files ---------- */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--ink3);cursor:pointer;background:#fafbfc}
.drop:hover,.drop.over{border-color:var(--steel2);background:var(--steelsoft);color:var(--steel)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.file{display:flex;align-items:center;gap:9px;padding:6px 10px;border:1px solid var(--line2);border-radius:var(--r);background:#fafbfc;font-size:12.5px}
.file .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .ext{width:30px;height:30px;border-radius:4px;background:var(--steelsoft);color:var(--steel);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono);flex:0 0 30px}

#gate{position:fixed;inset:0;background:linear-gradient(160deg,#171c22,#1d3444);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#gate.on{display:flex}
#gateBox{background:var(--panel);border-radius:12px;width:min(420px,100%);padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
#gateBox h2{margin:0 0 4px;font-size:19px}#gateBox p{margin:0 0 18px;color:var(--ink3);font-size:13px}
#gateMsg{color:var(--bad);font-size:12.5px;min-height:18px;margin-top:6px}
#who{padding:6px 10px;border-bottom:1px solid #2b333c;font-size:11.5px;color:#9fb0c0;display:flex;gap:8px;align-items:center}
#who b{color:#fff;font-weight:600}#who .r{margin-inline-start:auto;background:#2c343d;padding:1px 7px;border-radius:9px;font-size:10.5px}
.ro .hideRO{display:none!important}
#toast{position:fixed;inset-block-end:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{opacity:1}
#banner{background:var(--warnsoft);color:var(--warn);padding:7px 20px;font-size:12.5px;border-bottom:1px solid #eadcc2;display:none}
#banner.on{display:block}
.hl{background:#fdf2c9;border-radius:2px}
@media(max-width:820px){
  #rail{width:56px;flex:0 0 56px} #brandText,nav button span.lb,nav .cnt,#railFoot button span{display:none}
  nav button{justify-content:center} #railFoot button{padding:7px 0}
  .kv{grid-template-columns:1fr}
}
@media print{#rail,#top,.noprint{display:none}#view{overflow:visible}}
</style>
</head>
<body>
<div id="shell">
  <aside id="rail">
    <div id="brand"><div id="brandLogo">TT</div><div id="brandText"><b>Equip360</b><span id="brandSub">Asset tracking system</span></div></div>
    <div id="who"></div>
    <nav id="nav"></nav>
    <div id="railFoot">
      <div class="fb">
        <button id="btnScan">⌗ <span>Scan</span></button>
        <button id="btnBackup">⬇ <span>Backup</span></button>
        <button id="btnRestore">⬆ <span>Restore</span></button>
        <button id="btnLock">⏻ <span>Sign out</span></button>
      </div>
      <div id="dbState">—</div><div id="ttCopy" style="margin-top:6px;font-size:9.5px;color:#6b7783;line-height:1.35">© 2026 Jafar Shahrokhi<br>All rights reserved</div>
    </div>
  </aside>
  <div id="main">
    <div id="banner"></div>
    <header id="top"><h1 id="ttl">Dashboard</h1><div class="sub" id="sub"></div><div class="grow"></div><div id="topActions" class="row"></div></header>
    <main id="view"></main>
  </div>
</div>
<div id="sheet"><div id="sheetBox"><div id="sheetHead"></div><div id="sheetBody"></div></div></div>
<div id="modal"><div id="modalBox"><div id="modalHead"><b id="modalTitle"></b><button class="x" id="modalX">×</button></div><div id="modalBody"></div><div id="modalFoot"></div></div></div>
<div id="gate"><div id="gateBox"></div></div>
<div id="toast"></div>
<input type="file" id="hiddenFile" style="display:none" multiple>
<input type="file" id="hiddenRestore" style="display:none" accept=".json">

<script>
/* Display branding layer — Equip360. Rewrites user-visible product text and
   document/report/backup output. The internal product identifier is unchanged,
   so existing licences stay valid. */
(function(){
  var BRAND="Equip360", OLD="ToolTrace", COPY="© 2026 Jafar Shahrokhi. All rights reserved.";
  function swap(s){return typeof s==="string" && s.indexOf(OLD)>=0 ? s.split(OLD).join(BRAND) : s;}
  // keep the window/tab title on-brand even when the app resets it
  try{
    var d=Object.getOwnPropertyDescriptor(Document.prototype,"title");
    if(d&&d.get&&d.set){Object.defineProperty(document,"title",{configurable:true,
      get:function(){return d.get.call(document);},
      set:function(v){d.set.call(document,swap(v));}});}
    document.title=swap(document.title);
  }catch(e){}
  // fix brand text as the app renders it (scoped to the chrome, cheap)
  function fix(node){
    if(!node)return;

        if(m.type==="characterData")fix(m.target); else m.addedNodes&&m.addedNodes.forEach&&m.addedNodes.forEach(fix);
      });}).observe(el,{subtree:true,childList:true,characterData:true});
    });
